# 这2个 也是案例  注意 ,一个是 pod ,一个是 service, 他们2个相当于是一组


apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  selector:
#    选择的 pod的 标签, key 是 app.kubernetes.io/name, value 是 proxy
    app.kubernetes.io/name: proxy
  ports:
#    这个代表
    - name: name-of-service-port
      protocol: TCP
      # service 的端口号, 这个是外部访问的端口
      port: 80
      # 这个是 pod 的端口别名, 就是上面 pod 里定义的容器端口的 name
      # 可以通过 端口号的方式指定, 也可以通过端口别名的方式指定, 这里是通过端口别名的方式指定
      targetPort: http-web-svc

---
+apiVersion: v1
kind: Pod
metadata:
  name: nginx
  labels:
    # pod的标签
    app.kubernetes.io/name: proxy
spec:
  containers:
    # 容器的名称
    - name: nginx
      # 镜像名称
      image: nginx:stable
      ports:
        # 容器的端口
        - containerPort: 80
        # 容器的端口别名
          name: http-web-svc