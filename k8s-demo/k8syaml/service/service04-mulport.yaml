# 真正的写法, 但是不是最终写法, service应该是 deployment一起使用

# 首先有有一个pod

apiVersion: v1
# 定义资源种类
kind: Pod
# 元数据信息
metadata:
  # 资源名称, 就是pod的名称
  name: nginx1
  # 规格信息, 对pod预期行为的规约
  # 给pod 打一个标签, 好让 service可以选择这个pod
  labels:
    app: nginx1
spec:
  # 容器列表(1个pod可以管理多个容器)
  containers:
    # 容器的名字
    - name: nginx
      # 容器使用的镜像
      image: nginx:1.19
      # 容器暴露的 端口信息
      ports:
        # 容器端口
        - containerPort: 80


---
#定义 service
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  selector:
    #    指向pod的标签, 说明这个service 是 绑定 标签为 app: nginx1 的所有pod
    app: nginx1
  ports:
    - protocol: TCP
      name: mul-port1
      port: 80
      # 指向pod的端口, 就是容器的端口
      targetPort: 80
      nodePort: 30001   # 手动指定，范围必须在 30000-32767 内
    - protocol: TCP
      port: 8081
      targetPort: 80
      name: mul-port2
  type: NodePort
