spring:
  application:
    name: service-product  # 指定应用名称

  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      config:
        import-check:
          enabled: false  #

      username: nacos
      password: nacos


    sentinel:
      transport:
        dashboard: localhost:8081   # sentinel控制台地址
      eager: true  # 启动时加载规则


server:
  port: 9000


